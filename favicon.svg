<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00897B" />
      <stop offset="50%" stop-color="#26A69A" />
      <stop offset="100%" stop-color="#00695C" />
    </linearGradient>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="64" height="64" rx="16" fill="#1E242B" />

  <!-- Digital Minimal Trophy Cup Icon -->
  <g transform="translate(0, 1)">
    <!-- Globe Sphere -->
    <circle cx="32" cy="18" r="9.5" fill="url(#gold-grad)" />
    <ellipse cx="30" cy="15" rx="4" ry="2.5" fill="#FFF9C4" opacity="0.6" />

    <!-- Modern Abstract Arms / Cup Body -->
    <path d="M 22,34 C 20,26 24,20 28,19 C 29,24 30,27 32,32 C 34,27 35,24 36,19 C 40,20 44,26 42,34 C 39,41 35,44 32,45 C 29,44 25,41 22,34 Z" fill="url(#gold-grad)" />
    
    <!-- Inner Body Cutout Shadow -->
    <path d="M 28,24 C 30,29 32,33 32,37 C 32,33 34,29 36,24 C 34,23 30,23 28,24 Z" fill="#E65100" opacity="0.3" />

    <!-- Teal/Emerald Accent Band -->
    <rect x="23" y="44" width="18" height="5" rx="2.5" fill="url(#teal-grad)" stroke="#FFE57F" stroke-width="0.6" />

    <!-- Gold Pedestal Base -->
    <path d="M 21,50 L 43,50 L 45,55 L 19,55 Z" fill="url(#gold-grad)" />
    <line x1="20" y1="55" x2="44" y2="55" stroke="#FFE57F" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>
